baseURL = "https://hugo-paper.vercel.app/"
title = "나 소개하기"
author = "황현성"
copyright = "© 2026, 황현성"
languageCode = "ko-KR"
DefaultContentLanguage = "ko"
enableInlineShortcodes = true
# prevent build failures when using Hugo's Instagram shortcode due to deprecated Instagram API.
# See https://github.com/gohugoio/hugo/issues/7228#issuecomment-714490456
ignoreErrors = ["error-remote-getjson"]
[pagination]
  pagerSize = 3

# ------------------------------


[params]
  description = '나의 관심분야와 활동을 소개하는 사이트'
  color = 'linen'
  github = 'Hyeonseong-Hwang'
  instagram = '100.10.1001'

  avatar = 'https://hyeonseong-hwang.github.io/MyProfile-HHS/images/avatar.jpg'
  name = '황현성'
  bio = '안녕하세요, 전북대학교 컴퓨터인공지능학부에 재학중인 황현성입니다. AI를 활용한 의료 기술 개발 및 정보 제공 홈페이지에 관심이 있습니다.다양한 전공 수업을 수강하여 제 관심 분야에 대한 이해력 증가와 실력 향상을 하는 게 목표입니다.'
