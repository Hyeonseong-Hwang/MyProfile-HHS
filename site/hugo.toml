# needed to  render raw HTML (e.g. <sub>, <sup>, <kbd>, <mark>)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
#  [markup.highlight]
#    lineNos = true

[menu]

  [[menu.main]]
    identifier = "about"
    name = "소개"
    url = "/about/"
    weight = 10
  [[menu.main]]
    identifier = "activity"
    name = "활동"
    url = "/post/"
    weight = 15
  [[menu.main]]
    parent = "activity"
    name = "홈페이지 만들기"
    url = "/post/mkpage/"
    weight = 1
  [[menu.main]]
    parent = "activity"
    name = "채팅 프로그램"
    url = "/post/mkchat/"
    weight = 2
  [[menu.main]]
    identifier = "contact"
    name = "연락"
    url = "/contact/"
    weight = 20

[taxonomies]
category = "categories"
tag = "tags"
series = "series"

[privacy]

  [privacy.vimeo]
    disabled = false
    simple = true

  [privacy.x]
    disabled = false
    enableDNT = true
    simple = true

  [privacy.instagram]
    disabled = false
    simple = true

  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

[services]

  [services.instagram]
    disableInlineCSS = true

  [services.x]
    disableInlineCSS = true
