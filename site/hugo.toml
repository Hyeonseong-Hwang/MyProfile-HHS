baseURL = "https://hugo-paper.vercel.app/"
title = "나 소개하기"
author = "황현성"
copyright = "© 2026, 황현성"
languageCode = "ko-KR"
DefaultContentLanguage = "ko"
enableInlineShortcodes = true
# prevent build failures when using Hugo's Instagram shortcode due to deprecated Instagram API.
# See https://github.com/gohugoio/hugo/issues/7228#issuecomment-714490456
ignoreErrors = ["error-remote-getjson"]
[pagination]
  pagerSize = 3

# ------------------------------


[params]
  description = '나의 관심분야와 활동을 소개하는 사이트'
  color = 'linen'
  github = 'Hyeonseong-Hwang'
  instagram = '100.10.1001'

  avatar = 'https://hyeonseong-hwang.github.io/MyProfile-HHS/images/avatar.jpg'
  name = '황현성'
  bio = 'JBNU Computer Science & Artificial Intelligence'
# ------------------------------

# needed to  render raw HTML (e.g. <sub>, <sup>, <kbd>, <mark>)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
#  [markup.highlight]
#    lineNos = true

[menu]

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 10

[taxonomies]
category = "categories"
tag = "tags"
series = "series"

[privacy]

  [privacy.vimeo]
    disabled = false
    simple = true

  [privacy.x]
    disabled = false
    enableDNT = true
    simple = true

  [privacy.instagram]
    disabled = false
    simple = true

  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

[services]

  [services.instagram]
    disableInlineCSS = true

  [services.x]
    disableInlineCSS = true
